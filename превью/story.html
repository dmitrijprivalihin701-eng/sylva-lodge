<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

.price b{display:block;font-family:'Jost';font-weight:400;font-size:52px}

.rate b{display:block;font-family:'Jost';font-weight:300;font-size:60px;line-height:1;color:#f2eee8}
.rate i{font-style:normal;color:#eba35f;letter-spacing:3px}
.tag{right:70px;top:1220px;background:rgba(22,22,19,.72);border:1px solid rgba(255,255,255,.2);font-size:24px;line-height:1.35}
.tag span{color:#eba35f}
.cta{position:absolute;top:1636px;left:0;right:0;font-size:28px;letter-spacing:.18em;text-transform:uppercase;color:#cfc8bd}
.cta i{display:block;font-style:normal;font-size:44px;margin-top:6px;color:#eba35f}

<div class="bg"></div><div class="shade"></div>
