<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<!-- Кадры для ролика 1080×1920. Режим через #: bg | title | end | cap:<номер>:<текст> (подпись над телефоном, прозрачный фон) -->
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Manrope:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent;color:#f2eee8;font-family:'Manrope',sans-serif}
.full{position:absolute;inset:0;background:#0e0f0d}
.bg{position:absolute;inset:-40px;background:url(http://localhost:8765/img/hero.jpg) 45% 50%/cover;filter:blur(14px) brightness(.3) saturate(.8)}
.shade{position:absolute;inset:0;background:radial-gradient(circle at 50% 58%,rgba(212,120,47,.26),transparent 50%),linear-gradient(180deg,rgba(14,15,13,.75),rgba(14,15,13,.2) 30%,rgba(14,15,13,.6))}
.logo{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;font-family:'Jost';font-weight:300;letter-spacing:.2em}
.logo svg{flex:none}
.c{text-align:center;position:absolute;left:70px;right:70px}
h1{font-family:'Jost';font-weight:200;font-size:132px;line-height:.98;letter-spacing:-.01em}
h1 b{font-weight:300;color:#eba35f}
.lead{font-size:38px;line-height:1.35;color:#d9d3c9;font-family:'Jost';font-weight:300}
.steps{display:flex;flex-direction:column;gap:22px;align-items:center;margin-top:70px}
.steps div{font-size:30px;color:#cfc8bd}
.steps i{font-style:normal;display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#d4782f;color:#140c05;font-weight:600;margin-right:16px;font-size:22px}
.cap{position:absolute;left:60px;right:60px;top:150px;display:flex;align-items:center;gap:22px;padding:24px 30px;border-radius:30px;background:rgba(14,15,13,.86);border:1px solid rgba(235,163,95,.35);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.cap i{flex:none;font-style:normal;display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:#d4782f;color:#140c05;font-family:'Jost';font-weight:400;font-size:40px}
.cap span{font-family:'Jost';font-weight:300;font-size:44px;line-height:1.15}
.btn{display:inline-block;margin-top:54px;padding:26px 46px;border-radius:999px;background:#d4782f;color:#140c05;font-size:32px;font-weight:600}
</style></head><body>
<script>
const LOGO=(s,c)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c||'#eba35f'}" stroke-width="1.2"><path d="M12 2 L21 21 H3 Z"/><path d="M12 10 L16 18 H8 Z"/></svg>`;
const BG='<div class="full"></div><div class="bg"></div><div class="shade"></div>';
const mode=decodeURIComponent(location.hash.slice(1));
let h='';
if(mode==='bg'){
  h=BG+`<div class="logo" style="top:70px;font-size:34px">${LOGO(34)}SYLVA LODGE</div>`;
}else if(mode==='title'){
  h=BG+`<div class="logo" style="top:300px;font-size:40px">${LOGO(40)}SYLVA LODGE</div>
  <div class="c" style="top:540px"><h1>Приложение<br><b>онлайн‑брони</b></h1>
  <p class="lead" style="margin-top:46px">для ваших домиков: гость бронирует сам,<br>предоплата — сразу вам</p>
  <div class="steps"><div><i>1</i>Домик, даты и гости</div><div><i>2</i>Баня, чан и допы</div><div><i>3</i>Предоплата картой или СБП</div><div><i>4</i>Бронь — вам в Telegram</div></div></div>`;
}else if(mode==='end'){
  h=BG+`<div class="logo" style="top:300px;font-size:40px">${LOGO(40)}SYLVA LODGE</div>
  <div class="c" style="top:580px"><h1 style="font-size:104px">Брони и предоплата<br>приходят <b>сами</b></h1>
  <p class="lead" style="margin-top:50px">Даты закрываются автоматически —<br>никаких двойных броней и переписки.</p>
  <div class="btn">Хотите так же для своих домиков?</div>
  <p class="lead" style="margin-top:34px;font-size:32px;color:#eba35f">Напишите — покажу и настрою 🙂</p></div>`;
}else if(mode.startsWith('cap:')){
  const [,n,...t]=mode.split(':');
  h=`<div class="cap"><i>${n}</i><span>${t.join(':')}</span></div>`;
}
document.write(h);
</script>
</body></html>
