<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Макет таблицы заявок для ролика. Новая строка (данные в #…JSON) появляется сверху списка с подсветкой. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;background:#fff;color:#202124;font:13px/1.3 Roboto,'Segoe UI',Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:14px;font-weight:600;background:#fff}
.top{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;border-bottom:1px solid #e0e0e0}
.ico{width:30px;height:38px;border-radius:4px;background:#0f9d58;position:relative}
.ico::after{content:"";position:absolute;left:7px;right:7px;top:12px;bottom:9px;border:2px solid #fff;border-radius:1px;background:linear-gradient(#fff,#fff) 50% 0/2px 100% no-repeat,linear-gradient(#fff,#fff) 0 50%/100% 2px no-repeat}
.top b{display:block;font-size:15px;font-weight:500}
.top span{font-size:12px;color:#5f6368}
.tabs{display:flex;gap:2px;padding:0 10px;background:#f8f9fa;border-top:1px solid #e0e0e0;order:3}
.tabs div{padding:9px 14px;font-size:13px;color:#5f6368}
.tabs .on{color:#188038;border-bottom:3px solid #188038;font-weight:500;background:#fff}
.grid{flex:1;overflow:hidden;position:relative}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th,td{border:1px solid #e2e3e3;padding:7px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
th{background:#f3e6d8;font-weight:600;text-align:left;position:sticky;top:0}
.rn{width:28px;background:#f8f9fa;color:#5f6368;text-align:center;font-size:11px}
col.c1{width:76px}col.c2{width:84px}col.c3{width:96px}col.c4{width:84px}col.c5{width:auto}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;background:#e8eaed}
.st.new{background:#fde7c8;color:#8a4b0b;font-weight:600}
.st.ok{background:#d6efd8;color:#1e6b2c}
tr.fresh td{background:#fff6dd}
tr.fresh{opacity:0}
.show tr.fresh{opacity:1;transition:opacity .5s}
.show tr.fresh td{animation:flash 2.4s ease}
@keyframes flash{0%{background:#ffe08a}100%{background:#fff6dd}}
.ptr{position:absolute;right:14px;top:86px;padding:6px 10px;border-radius:8px;background:#1a73e8;color:#fff;font-size:12px;opacity:0;transform:translateX(10px)}
.show .ptr{opacity:1;transform:none;transition:all .5s .4s}
</style></head><body>
<div class="status"><span id="clock">12:41</span><span>●●● ▮</span></div>
<div class="top"><div class="ico"></div><div><b>Sylva Lodge — заявки</b><span>Google Таблицы</span></div></div>
<div class="grid">
  <table>
    <colgroup><col class="rn"><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"></colgroup>
    <thead><tr><th class="rn"></th><th>Статус</th><th>Домик</th><th>Даты</th><th>Сумма</th><th>Имя, телефон</th></tr></thead>
    <tbody id="tb">
      <tr><td class="rn">2</td><td><span class="st ok">подтверждена</span></td><td>Pine</td><td>13.12–15.12</td><td>11 500 ₽</td><td>Илья, +7 902…</td></tr>
      <tr><td class="rn">3</td><td><span class="st ok">подтверждена</span></td><td>Сертификат</td><td>—</td><td>10 000 ₽</td><td>Ольга, +7 912…</td></tr>
      <tr><td class="rn">4</td><td><span class="st">в работе</span></td><td>Family House</td><td>27.12–29.12</td><td>28 000 ₽</td><td>Марина, +7 950…</td></tr>
    </tbody>
  </table>
  <div class="ptr">+1 бронь · даты закрыты</div>
</div>
<div class="tabs"><div class="on">Заявки</div><div>Лист2</div></div>
<script>
const d=JSON.parse(decodeURIComponent(location.hash.slice(1)||'%7B%7D'));
const rub=n=>n?Number(n).toLocaleString('ru-RU')+' ₽':'';
const date=s=>{if(!s)return'';const p=String(s).split('-');return p.length===3?p[2]+'.'+p[1]:s};
const now=new Date();document.getElementById('clock').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
const tr=document.createElement('tr');tr.className='fresh';
const phone=String(d.phone||'').slice(0,7)+'…';
tr.innerHTML='<td class="rn">5</td><td><span class="st ok">оплачена</span></td><td>'+(d.house||'')+'</td><td>'+date(d.checkin)+'–'+date(d.checkout)+'</td><td>'+rub(d.total)+'</td><td>'+(d.name||'')+', '+phone+'</td>';
document.getElementById('tb').appendChild(tr);
setTimeout(()=>document.body.classList.add('show'),700);
</script>
</body></html>
