<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Sylva Lodge — превью 1200×630</title>
<!-- Макет карточки-превью. Рендер: headless Edge, окно 1200×630, масштаб 2, сайт должен быть запущен на localhost:8765 -->
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0e0f0d}
body{position:relative;font-family:'Manrope',sans-serif;color:#f2eee8}
.bg{position:absolute;inset:-20px;background:url(http://localhost:8765/img/hero.jpg) 30% 60%/cover;filter:blur(3px) brightness(.42) saturate(.85)}
.shade{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(14,15,13,.96) 0%,rgba(14,15,13,.82) 38%,rgba(14,15,13,.25) 70%,rgba(14,15,13,.55) 100%),
  radial-gradient(circle at 78% 30%,rgba(212,120,47,.28),transparent 45%)}
.left{position:absolute;left:64px;top:56px;width:520px;bottom:52px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;font-family:'Jost';font-size:14px;letter-spacing:.3em;color:#cfc8bd}
.logo svg{width:22px;height:22px}
h1{font-family:'Jost';font-weight:200;font-size:104px;line-height:.86;letter-spacing:-.02em;text-transform:uppercase;margin-top:34px}
h1 span{display:block}
.sub{font-family:'Jost';font-weight:300;font-size:25px;line-height:1.25;margin-top:22px;color:#e9e3da}
.sub b{font-weight:400;color:#eba35f}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);font-size:14px;background:rgba(255,255,255,.04)}
.bottom{margin-top:auto;display:flex;align-items:center;gap:16px}
.price{padding:14px 22px;border-radius:16px;background:#d4782f;color:#140c05;font-weight:600;font-size:16px}
.price b{font-family:'Jost';font-weight:400;font-size:26px;margin-left:4px}
.rate{padding:12px 18px;border-radius:16px;border:1px solid rgba(255,255,255,.22);font-size:14px;color:#cfc8bd}
.rate b{font-family:'Jost';font-weight:400;font-size:24px;color:#f2eee8;margin-right:6px}
.rate i{font-style:normal;color:#eba35f;letter-spacing:2px}

/* ноутбук */
.laptop{position:absolute;right:46px;top:92px;width:620px;transform:perspective(1600px) rotateY(-14deg) rotateX(3deg);transform-origin:right center;filter:drop-shadow(0 40px 50px rgba(0,0,0,.6))}
.screen{position:relative;width:620px;height:410px;border-radius:14px;background:#111;border:1px solid rgba(255,255,255,.18);overflow:hidden;padding:26px 6px 6px}
.bar{position:absolute;top:0;left:0;right:0;height:26px;display:flex;align-items:center;gap:6px;padding-left:12px;background:#1b1c19}
.bar i{width:9px;height:9px;border-radius:50%;background:#3a3b36}
.bar i:nth-child(1){background:#e0675b}.bar i:nth-child(2){background:#e6b54c}.bar i:nth-child(3){background:#5fc061}
.bar span{margin-left:14px;padding:3px 12px;border-radius:6px;background:#262722;font-size:10px;color:#9a958c}
.vp{position:relative;width:608px;height:378px;overflow:hidden;border-radius:6px}
.vp iframe{position:absolute;left:0;top:0;width:1440px;height:895px;border:0;transform:scale(.4222);transform-origin:0 0}
.base{width:680px;height:14px;margin:0 0 0 -30px;border-radius:0 0 18px 18px;background:linear-gradient(#2a2b27,#151612)}

/* телефон */
.phone{position:absolute;left:560px;top:206px;width:206px;height:412px;border-radius:32px;background:#0b0b0a;border:2px solid rgba(255,255,255,.2);padding:8px;box-shadow:0 24px 40px -10px rgba(0,0,0,.75)}
.pvp{position:relative;width:186px;height:392px;border-radius:24px;overflow:hidden}
.pvp iframe{position:absolute;left:0;top:0;width:390px;height:822px;border:0;transform:scale(.4769);transform-origin:0 0}
.notch{position:absolute;top:13px;left:50%;width:62px;height:16px;margin-left:-31px;border-radius:10px;background:#0b0b0a;z-index:2}
</style>
</head>
<body>
<div class="bg"></div><div class="shade"></div>

<div class="left">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 2 L21 21 H3 Z"/><path d="M12 10 L16 18 H8 Z"/></svg>GLAMPING · ЕКАТЕРИНБУРГ</div>
  <h1><span>Sylva</span><span>Lodge</span></h1>
  <p class="sub">Домики A‑frame в&nbsp;сосновом лесу.<br><b>Баня, горячий чан</b> и&nbsp;тишина.</p>
  <div class="chips"><span class="chip">Онлайн‑бронь за 2 минуты</span><span class="chip">Можно с собакой</span><span class="chip">Подарочные сертификаты</span></div>
  <div class="bottom">
    <div class="price">от <b>5&nbsp;000&nbsp;₽</b> / сутки</div>
    <div class="rate"><b>5,0</b><i>★★★★★</i></div>
  </div>
</div>

<div class="laptop">
  <div class="screen">
    <div class="bar"><i></i><i></i><i></i><span>sylva-lodge</span></div>
    <div class="vp"><iframe src="http://localhost:8765/?shot" scrolling="no"></iframe></div>
  </div>
  <div class="base"></div>
</div>

<div class="phone">
  <div class="notch"></div>
  <div class="pvp"><iframe src="http://localhost:8765/?shot" scrolling="no"></iframe></div>
</div>
</body>
</html>
