<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Sylva Lodge — пост 1080×1350</title>
<!-- Пост Instagram 4:5. Рендер: headless Edge, окно 1080×1350, сайт на localhost:8765 -->
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0e0f0d}
body{position:relative;font-family:'Manrope',sans-serif;color:#f2eee8}
.bg{position:absolute;inset:-30px;background:url(http://localhost:8765/img/hero.jpg) 40% 55%/cover;filter:blur(5px) brightness(.36) saturate(.85)}
.shade{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(14,15,13,.9) 0%,rgba(14,15,13,.3) 32%,rgba(14,15,13,.35) 66%,rgba(14,15,13,.95) 100%),
  radial-gradient(circle at 60% 52%,rgba(212,120,47,.3),transparent 45%)}
.top{position:absolute;left:72px;right:72px;top:70px}
.logo{display:flex;align-items:center;gap:12px;font-family:'Jost';font-size:22px;letter-spacing:.3em;color:#cfc8bd}
.logo svg{width:30px;height:30px}
h1{font-family:'Jost';font-weight:200;font-size:150px;line-height:.9;letter-spacing:-.02em;text-transform:uppercase;margin-top:26px;white-space:nowrap}
.sub{font-family:'Jost';font-weight:300;font-size:36px;line-height:1.25;margin-top:18px;color:#e9e3da}
.sub b{font-weight:400;color:#eba35f}
.laptop{position:absolute;left:72px;top:500px;width:760px;transform:perspective(1800px) rotateY(10deg) rotateX(2deg);transform-origin:left center;filter:drop-shadow(0 40px 50px rgba(0,0,0,.65))}
.screen{position:relative;width:760px;height:502px;border-radius:16px;background:#111;border:1px solid rgba(255,255,255,.18);overflow:hidden;padding:30px 7px 7px}
.bar{position:absolute;top:0;left:0;right:0;height:30px;display:flex;align-items:center;gap:7px;padding-left:14px;background:#1b1c19}
.bar i{width:11px;height:11px;border-radius:50%}
.bar i:nth-child(1){background:#e0675b}.bar i:nth-child(2){background:#e6b54c}.bar i:nth-child(3){background:#5fc061}
.bar span{margin-left:16px;padding:4px 14px;border-radius:7px;background:#262722;font-size:12px;color:#9a958c}
.vp{position:relative;width:746px;height:465px;overflow:hidden;border-radius:7px}
.vp iframe{position:absolute;left:0;top:0;width:1440px;height:898px;border:0;transform:scale(.5181);transform-origin:0 0}
.base{width:830px;height:16px;margin-left:-35px;border-radius:0 0 20px 20px;background:linear-gradient(#2a2b27,#151612)}
.phone{position:absolute;right:72px;top:640px;width:250px;height:504px;border-radius:38px;background:#0b0b0a;border:2px solid rgba(255,255,255,.22);padding:10px;box-shadow:0 30px 50px -10px rgba(0,0,0,.8)}
.pvp{position:relative;width:226px;height:480px;border-radius:30px;overflow:hidden}
.pvp iframe{position:absolute;left:0;top:0;width:390px;height:828px;border:0;transform:scale(.5795);transform-origin:0 0}
.notch{position:absolute;top:17px;left:50%;width:72px;height:19px;margin-left:-36px;border-radius:12px;background:#0b0b0a;z-index:2}
.bottom{position:absolute;left:72px;right:72px;bottom:64px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.price{padding:16px 24px;border-radius:18px;background:#d4782f;color:#140c05;font-weight:600;font-size:20px}
.price b{font-family:'Jost';font-weight:400;font-size:34px;margin-left:4px}
.chip{padding:12px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.24);font-size:19px;background:rgba(255,255,255,.05)}
.rate b{font-family:'Jost';font-weight:400;font-size:24px;margin-right:6px}
.rate i{font-style:normal;color:#eba35f;letter-spacing:2px}
</style>
</head>
<body>
<div class="bg"></div><div class="shade"></div>
<div class="top">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 2 L21 21 H3 Z"/><path d="M12 10 L16 18 H8 Z"/></svg>GLAMPING · ЕКАТЕРИНБУРГ</div>
  <h1>Sylva Lodge</h1>
  <p class="sub">Домики A‑frame в&nbsp;сосновом лесу.<br><b>Баня, горячий чан</b> и&nbsp;тишина</p>
</div>
<div class="laptop">
  <div class="screen"><div class="bar"><i></i><i></i><i></i><span>sylva-lodge</span></div><div class="vp"><iframe src="http://localhost:8765/?shot" scrolling="no"></iframe></div></div>
  <div class="base"></div>
</div>
<div class="phone"><div class="notch"></div><div class="pvp"><iframe src="http://localhost:8765/?shot" scrolling="no"></iframe></div></div>
<div class="bottom">
  <div class="price">от <b>5&nbsp;000&nbsp;₽</b> / сутки</div>
  <span class="chip rate"><b>5,0</b><i>★★★★★</i></span>
  <span class="chip">Онлайн‑бронь</span>
  <span class="chip">Можно с собакой</span>
</div>
</body>
</html>
